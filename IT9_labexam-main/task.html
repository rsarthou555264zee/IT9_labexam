<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Student Task Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="task.html">Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>                  
            </div>
        </div>
    </nav>
    <section class="pt-5 mt-5 pb-5">
        <div class="container">
            <h1 class="mb-3">My Tasks</h1>
            <p>Add, manage, and keep track of your tasks.</p>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <input type="text" id="taskTitle" class="form-control" placeholder="Task title">
                        </div>
                        <div class="col-md-3">
                            <input type="date" id="dueDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <select id="priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button onclick="addTask()" class="btn btn-primary w-100">Add Task</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col"><div class="card text-center"><div class="card-body">
                    <h6>Total</h6><h4 id="total">0</h4>
                </div></div></div>
                <div class="col"><div class="card text-center"><div class="card-body">
                    <h6>Pending</h6><h4 id="pending">0</h4>
                </div></div></div>
                <div class="col"><div class="card text-center"><div class="card-body">
                    <h6>Completed</h6><h4 id="completed">0</h4>
                </div></div></div>
            </div>

            <table class="table table-striped">
                <thead>
                    <tr><th>Task</th><th>Due Date</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="taskList"></tbody>
            </table>

            <button onclick="clearAll()" class="btn btn-danger">Clear All</button>
        </div>
    </section>

    <footer class="text-center py-4 bg-dark text-white"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
